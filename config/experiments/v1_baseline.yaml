# Baseline rule set: the engine as it was before the decision-engine change (PR #6).
# Used only by the backtester to compare against the current rules
# (config/decision_engine.yaml). Differences from current:
#   - no 2H/4H confirmation for futures/MCX (4H scored, daily must not oppose)
#   - no 4H confirmation for cash swing (weekly scored)
#   - volume compared with the previous 20 bars, not the same time slot
#   - no volume check for pullbacks or range reversals
#   - range reversal lookback 60 bars, regime permission soft (not hard)
version: 1
global:
  capital: 1000000
  system:
    paper_trading_only: true
    live_order_execution: false
    averaging_down: false
    forced_trades: false
  risk:
    risk_per_trade_pct: 1.0
    max_open_positions: 3
    max_open_risk_pct: 3.0
    max_margin_blocked_pct: 60
    max_total_deployed_pct: 85
  limits:
    max_new_trades_day: 5
    max_new_trades_week: 15
    max_ai_evaluations_day: 5
  drawdown:
    daily_loss_pct: 2.0
    weekly_loss_pct: 4.0
    peak_drawdown_pct: 10.0
  scoring:
    min_shortlist_score: 60
    min_rr: 2.0
    weights:
      htf_trend: 25
      setup_quality: 25
      volume_oi: 15
      rr_stop: 15
      regime_fit: 10
      relative_strength: 10
  geometry:
    stop_buffer_atr: 0.25
    min_stop_atr: 1.0
    max_stop_atr: 3.0
    max_rr: 4.0
    no_level_rr: 3.0
    swing_fractal_bars: 2
  regime:
    high_vol_ratio: 1.5
    adx_period: 14
    adx_trend_min: 25
    adx_sideways_max: 20
    ema_slope_bars: 10
    instability_changes: 3
    instability_window: 10
    min_daily_bars: 200
  permissions:
    STRONG_UP:
      pullback:
        directions:
        - long
        risk_mult: 1.0
        preferred: true
      breakout:
        directions:
        - long
        risk_mult: 1.0
        preferred: true
    STRONG_DOWN:
      pullback:
        directions:
        - short
        risk_mult: 1.0
        preferred: true
      breakout:
        directions:
        - short
        risk_mult: 1.0
        preferred: true
    SIDEWAYS:
      range_reversal:
        directions:
        - long
        - short
        risk_mult: 1.0
        preferred: true
      breakout:
        directions:
        - long
        - short
        risk_mult: 1.0
        preferred: false
        min_volume_ratio: 2.0
    HIGH_VOL:
      pullback:
        directions:
        - long
        - short
        risk_mult: 0.5
        preferred: false
        with_trend_only: true
    UNSTABLE: {}
  trailing_shadow:
    start_r: 1.5
    trail_atr: 2.0
instruments:
  stock_futures:
    enabled: true
    primary_tf: 60minute
    confirmation_tfs: []
    context_tfs:
    - day
    context_must_not_oppose:
    - day
    directions:
    - long
    - short
    shortlist_per_scan: 5
    entry_valid_bars: 2
    hold_trading_days: 3
    no_entry_first_minutes: 15
    no_entry_last_minutes: 30
    max_spread_pct: 0.1
    min_primary_bars: 60
    htf_score_tf: 4h
    orb_enabled: true
    orb_universe_size: 25
  index_futures:
    enabled: true
    primary_tf: 60minute
    confirmation_tfs: []
    context_tfs:
    - day
    context_must_not_oppose:
    - day
    directions:
    - long
    - short
    shortlist_per_scan: 5
    entry_valid_bars: 2
    hold_trading_days: 3
    no_entry_first_minutes: 15
    no_entry_last_minutes: 30
    max_spread_pct: 0.1
    min_primary_bars: 60
    htf_score_tf: 4h
  mcx:
    enabled: true
    primary_tf: 60minute
    confirmation_tfs: []
    context_tfs:
    - day
    context_must_not_oppose:
    - day
    directions:
    - long
    - short
    shortlist_per_scan: 5
    entry_valid_bars: 2
    hold_trading_days: 3
    no_entry_first_minutes: 15
    no_entry_last_minutes: 30
    max_spread_pct: 0.1
    min_primary_bars: 60
    value_per_point:
      GOLDM: 10
      SILVERM: 5
      CRUDEOILM: 10
      NATGASMINI: 250
    htf_score_tf: 4h
  index_options:
    enabled: false
    primary_tf: 10minute
    confirmation_tfs:
    - 30m
    - 1h
    context_tfs:
    - 4h
    - day
    context_must_not_oppose: []
    directions:
    - long_options
    shortlist_per_scan: 2
    entry_valid_bars: 2
    hold_trading_days: 1
    no_entry_first_minutes: 15
    no_entry_last_minutes: 30
    max_spread_pct: 2.0
    min_primary_bars: 60
  stock_options:
    enabled: false
  cash_swing:
    enabled: true
    primary_tf: day
    confirmation_tfs: []
    context_tfs:
    - week
    - day
    htf_score_tf: week
    context_must_not_oppose: []
    directions:
    - long
    shortlist_per_scan: 2
    hold_trading_days: 7
    entry_window:
    - 09:30
    - '11:00'
    scan_after: '15:45'
    min_turnover_cr: 50
    max_stop_pct: 8.0
    max_position_value: 250000
    max_invested: 400000
    max_open_positions: 2
    max_new_trades_day: 2
    max_open_risk_pct: 2.0
    min_primary_bars: 250
  cup_handle:
    enabled: true
    primary_tf: day
    directions:
    - long
    shortlist_per_scan: 2
    hold_trading_days: 40
    min_primary_bars: 300
    entry_window:
    - 09:15
    - '15:15'
    stop_pct: 8.0
    target_pct: 20.0
    event_block_days: 5
    min_turnover_cr: 50
    prior_uptrend_pct: 30
    prior_lookback_days: 130
    cup_min_weeks: 7
    cup_max_weeks: 65
    cup_min_depth_pct: 12
    cup_max_depth_pct: 33
    rounded_bottom_min_fraction: 0.3
    rim_tolerance_pct: 10
    handle_min_days: 5
    handle_max_days: 25
    handle_max_depth_pct: 12
    breakout_volume_ratio: 1.5
    volume_avg_days: 50
    max_extended_pct: 5
    rs_lookback_days: 126
    max_position_value: 200000
    max_open_positions: 3
strategies:
  pullback:
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    rsi_band_long:
    - 40
    - 50
    rsi_band_short:
    - 50
    - 60
    volume_multiplier: 0.0
    atr_period: 14
    min_rr: 2.0
    lookback: 20
    touch_tolerance_atr: 0.25
    volume_reference: previous_bars
  breakout:
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    volume_multiplier: 1.5
    atr_period: 14
    min_rr: 2.0
    lookback: 20
    strong_close_atr: 0.25
    volume_reference: previous_bars
  range_reversal:
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    volume_multiplier: 0.0
    atr_period: 14
    min_rr: 2.0
    lookback: 60
    min_reactions: 2
    level_tolerance_atr: 0.5
    edge_fraction: 0.25
    min_range_atr: 2.0
    requires_regime: null
    volume_reference: previous_bars
  orb:
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    volume_multiplier: 1.5
    atr_period: 14
    min_rr: 2.0
    lookback: 20
    range_minutes: 30
    bar_minutes: 10
    wide_range_atr: 0.6
    min_range_atr: 0.15
    max_range_atr: 1.2
    max_gap_pct: 3.0
    entry_valid_bars: 2
    exit_time: '15:15'
    score_weights:
      volume: 30
      nifty_alignment: 25
      relative_strength: 15
      range_quality: 15
      close_strength: 15
